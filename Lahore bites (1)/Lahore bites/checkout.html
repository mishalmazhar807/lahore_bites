<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Lahore Bites</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #fff7f8;
      color: #111827;
    }

    header {
      background: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      color: #ef4f5f;
    }

    .back-btn {
      text-decoration: none;
      background: #ef4f5f;
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 700;
    }

    .container {
      width: 86%;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 30px;
    }

    .panel {
      background: white;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .panel h1,
    .panel h2 {
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .form-group textarea {
      resize: none;
      height: 95px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #ef4f5f;
      box-shadow: 0 0 0 3px rgba(239,79,95,0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f1f1f1;
      font-weight: 600;
      color: #374151;
    }

    .summary-row.total {
      font-size: 24px;
      color: #ef4f5f;
      font-weight: 900;
      border-bottom: none;
      margin-top: 10px;
    }

    .cart-list {
      margin-bottom: 18px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f1f1;
      color: #374151;
      font-size: 15px;
    }

    .place-btn {
      width: 100%;
      margin-top: 25px;
      border: none;
      background: #ef4f5f;
      color: white;
      padding: 15px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .place-btn:hover {
      background: #d9364a;
    }

    .empty-msg {
      color: #667085;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Lahore Bites</div>
    <a href="cart.html" class="back-btn">← Back to Cart</a>
  </header>

  <main class="container">

    <section class="panel">
      <h1>Checkout Details</h1>

      <form onsubmit="placeOrder(event)">
        <div class="row">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <textarea id="address" placeholder="House no, street, area, city" required></textarea>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod" required>
              <option value="">Select payment method</option>
              <option value="Cash on Delivery">Cash on Delivery</option>
              <option value="Online Payment">Online Payment</option>
            </select>
          </div>

          <div class="form-group">
            <label>Delivery Instructions</label>
            <input type="text" id="instructions" placeholder="e.g. call before delivery">
          </div>
        </div>

        <div class="form-group">
          <label>Order Notes</label>
          <textarea id="notes" placeholder="Any special instructions for restaurant"></textarea>
        </div>

        <button type="submit" class="place-btn">Place Order</button>
      </form>
    </section>

    <aside class="panel">
      <h2>Order Summary</h2>

      <div class="cart-list" id="checkoutCartList"></div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">Rs. 0</span>
      </div>

      <div class="summary-row">
        <span>Delivery Fee</span>
        <span id="deliveryFee">Rs. 150</span>
      </div>

      <div class="summary-row">
        <span>Tax</span>
        <span id="tax">Rs. 0</span>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <span id="grandTotal">Rs. 0</span>
      </div>
    </aside>

  </main>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const loggedInUser = localStorage.getItem("loggedInUser") || "";
    document.getElementById("customerName").value = loggedInUser;

    const checkoutCartList = document.getElementById("checkoutCartList");
    const subtotalEl = document.getElementById("subtotal");
    const taxEl = document.getElementById("tax");
    const grandTotalEl = document.getElementById("grandTotal");

    function normalizeCart() {
      cart = cart.map(item => {
        if (typeof item === "string") {
          return {
            name: item,
            price: 500,
            qty: 1
          };
        }

        return {
          name: item.name,
          price: item.price || 500,
          qty: item.qty || 1
        };
      });

      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function renderSummary() {
      normalizeCart();

      checkoutCartList.innerHTML = "";

      if (cart.length === 0) {
        checkoutCartList.innerHTML = `
          <p class="empty-msg">
            Your cart is empty. Please add food items before checkout.
          </p>
        `;
        subtotalEl.textContent = "Rs. 0";
        taxEl.textContent = "Rs. 0";
        grandTotalEl.textContent = "Rs. 0";
        return;
      }

      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;

        checkoutCartList.innerHTML += `
          <div class="cart-item">
            <span>${item.name} × ${item.qty}</span>
            <strong>Rs. ${itemTotal}</strong>
          </div>
        `;
      });

      const deliveryFee = 150;
      const tax = Math.round(subtotal * 0.05);
      const grandTotal = subtotal + deliveryFee + tax;

      subtotalEl.textContent = "Rs. " + subtotal;
      taxEl.textContent = "Rs. " + tax;
      grandTotalEl.textContent = "Rs. " + grandTotal;

      localStorage.setItem("orderSubtotal", subtotal);
      localStorage.setItem("orderTax", tax);
      localStorage.setItem("orderDeliveryFee", deliveryFee);
      localStorage.setItem("orderGrandTotal", grandTotal);
    }

    function placeOrder(event) {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Your cart is empty. Please add items first.");
        return;
      }

      const order = {
        orderId: "LB" + Math.floor(100000 + Math.random() * 900000),
        customerName: document.getElementById("customerName").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        paymentMethod: document.getElementById("paymentMethod").value,
        instructions: document.getElementById("instructions").value,
        notes: document.getElementById("notes").value,
        cart: cart,
        subtotal: localStorage.getItem("orderSubtotal"),
        deliveryFee: localStorage.getItem("orderDeliveryFee"),
        tax: localStorage.getItem("orderTax"),
        grandTotal: localStorage.getItem("orderGrandTotal"),
        status: "Order Placed",
        createdAt: new Date().toLocaleString()
      };

      localStorage.setItem("latestOrder", JSON.stringify(order));

      let orders = JSON.parse(localStorage.getItem("orders")) || [];
      orders.push(order);
      localStorage.setItem("orders", JSON.stringify(orders));

      localStorage.removeItem("cart");

      alert("Order placed successfully!");

      window.location.href = "order-tracking.html";
    }

    renderSummary();
  </script>

</body>
</html>
