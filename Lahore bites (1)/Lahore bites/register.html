<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lahore Bites</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

  body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.62), rgba(0,0,0,0.62)),
    url("assets/images/auth-bg.jpg") center center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

    .auth-box {
      width: 520px;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      font-style: italic;
      color: #ef4f5f;
      margin-bottom: 10px;
    }

    .auth-box h2 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
      color: #111827;
    }

    .auth-box p {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111827;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #ef4f5f;
      box-shadow: 0 0 0 3px rgba(239,79,95,0.12);
    }

    .btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 16px;
      background: #ef4f5f;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:hover {
      background: #dc3f50;
    }

    .bottom-text {
      text-align: center;
      margin-top: 20px;
      color: #667085;
      font-size: 15px;
    }

    .bottom-text a {
      color: #ef4f5f;
      text-decoration: none;
      font-weight: 700;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #111827;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .auth-box {
        width: 100%;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="auth-box">
    <div class="logo">Lahore Bites</div>

    <h2>Create Account</h2>
    <p>Register to order food, save addresses and track deliveries.</p>

    <form onsubmit="registerUser(event)">
  <div class="row">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="full_name" placeholder="Enter full name" required>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
    </div>
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter email" required>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create password" required>
    </div>

    <div class="form-group">
      <label>Role</label>
      <select id="role" required>
        <option value="customer">Customer</option>
        <option value="restaurant_owner">Restaurant Owner</option>
        <option value="rider">Rider</option>
      </select>
    </div>
  </div>

  <button type="submit" class="btn">Register</button>
</form>
   

    <div class="bottom-text">
      Already have an account? <a href="login.html">Login</a>
    </div>

    <a class="home-link" href="index.html">← Back to Home</a>
  </div>
<script>
function registerUser(event) {
  event.preventDefault();

  const formData = new FormData();
  formData.append("full_name", document.getElementById("full_name").value.trim());
  formData.append("phone", document.getElementById("phone").value.trim());
  formData.append("email", document.getElementById("email").value.trim());
  formData.append("password", document.getElementById("password").value.trim());
  formData.append("role", document.getElementById("role").value);

  fetch("backend/auth/register.php", {
    method: "POST",
    body: formData
  })
  .then(response => response.text())
  .then(text => {
    console.log(text);
    const data = JSON.parse(text);
    alert(data.message);

    if (data.status === "success") {
      window.location.href = "login.html";
    }
  })
  .catch(error => {
    console.error(error);
    alert("Register failed. Press F12 and check Console.");
  });
}
</script>
</body>
</html>
